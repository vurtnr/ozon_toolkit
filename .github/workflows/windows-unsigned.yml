name: Windows Unsigned Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-unsigned:
    runs-on: windows-latest
    env:
      DIST_DIR: dist/windows-unsigned

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build Windows sidecar
        shell: bash
        run: bun run src-sidecar/scripts/build-sidecar.ts --target bun-windows-x64

      - name: Build unsigned Windows bundle
        run: bunx tauri build --ci --target x86_64-pc-windows-msvc --no-sign

      - name: Stage distributable installers
        shell: pwsh
        run: |
          $bundleRoot = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          $distDir = $env:DIST_DIR
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $stagedFiles = @()

          New-Item -ItemType Directory -Force -Path $distDir | Out-Null

          $msi = Get-ChildItem -Path (Join-Path $bundleRoot "msi") -Recurse -File -Filter *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) {
            $dest = Join-Path $distDir "desktop-app-windows-x64-unsigned-$shortSha.msi"
            Copy-Item $msi.FullName $dest
            $stagedFiles += $dest
          }

          $exe = Get-ChildItem -Path (Join-Path $bundleRoot "nsis") -Recurse -File -Filter *.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($exe) {
            $dest = Join-Path $distDir "desktop-app-windows-x64-unsigned-$shortSha.exe"
            Copy-Item $exe.FullName $dest
            $stagedFiles += $dest
          }

          if ($stagedFiles.Count -eq 0) {
            throw "No MSI or EXE installers found under $bundleRoot"
          }

          $checksums = foreach ($file in $stagedFiles) {
            $hash = (Get-FileHash -Path $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$(Split-Path $file -Leaf)"
          }
          Set-Content -Path (Join-Path $distDir "SHA256SUMS.txt") -Value $checksums

      - name: Summarize packaged installers
        shell: pwsh
        run: |
          "Packaged files:" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Get-ChildItem -Path $env:DIST_DIR -File |
            Sort-Object Name |
            ForEach-Object {
              "- $($_.Name) ($([Math]::Round($_.Length / 1MB, 2)) MB)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            }

      - name: Upload Windows unsigned installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-app-windows-unsigned-${{ github.sha }}
          path: ${{ env.DIST_DIR }}/*
          if-no-files-found: error
          retention-days: 14
